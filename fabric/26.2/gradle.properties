# 提高 gradle 可用内存（Minecraft 反编译/映射需要）
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ===== Fabric 工具链版本 =====
# 版本来源：https://fabricmc.net/develop 与 FabricMC/fabric-example-mod 官方模板
# 注意：自 Minecraft 26.x 起，Fabric 模板不再使用 yarn_mappings 字段，
#       Loom 直接使用 Mojang 官方映射；因此本文件不含 yarn_mappings。
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# ===== Mod 属性 =====
maven_group=computer.heather.advancedbackups
archives_base_name=advancedbackups
modloaderName=fabric
minecraftVersion=26.2

# ===== 依赖 =====
fabric_api_version=0.161.0+26.2

# 注意：version 由命令行 -Pversion=xxx 覆盖（与 build-all.sh / CI 行为一致）
version=2.2.0
